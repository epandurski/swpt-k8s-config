apiVersion: batch/v1
kind: Job
metadata:
  name: splitting-phase-1-job
  labels:
    app.kubernetes.io/component: shard-splitting-job
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/component: shard-splitting-job
    spec:
      podReplacementPolicy: Failed
      priorityClassName: shard-background-worker
      imagePullSecrets:
        - name: regcreds
      containers:
      - name: done  
        image: swpt-accounts
        args: ['true']
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      initContainers:
      - name: verify-shard-content
        image: swpt-accounts
        args: ['verify_shard_content']
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        envFrom:
          - secretRef:
              name: db-owner-credentials
            prefix: pg_
          - secretRef:
              name: broker-default-user
            prefix: rmq_
          - configMapRef:
              name: shardconfig
        env:
          - name: POSTGRES_URL
            value: "postgresql+psycopg://$(pg_username):$(pg_password)@$(pg_cluster_name):5432/db"
          - name: PROTOCOL_BROKER_URL
            value: "$(rmq_connection_string)"
          - name: PROTOCOL_BROKER_QUEUE
            value: "$(pg_cluster_name)"
        resources:
          requests:
            cpu: 10m
            memory: 100Mi
      restartPolicy: OnFailure
  backoffLimit: 2147483647
